[project]
name = "devcontainer-repo-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mandana Khademi", email = "mandana.khademi@madetech.com" }
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.32.5",
    "urllib3<2.0.0",
]

[project.scripts]
devcontainer-repo-scanner = "devcontainer_repo_scanner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
